name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            set -e
            cd ${{ secrets.TARGET_DIRECTORY }}
            git fetch origin main
            git reset --hard origin/main
            pnpm install --frozen-lockfile
            rm -rf .next
            pnpm build
            pm2 restart homepage

      - name: Verify production responds
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L https://ilia.to/ || true)
            if [ "$code" = "200" ]; then
              echo "production up (HTTP $code)"
              exit 0
            fi
            echo "attempt $i: HTTP $code, retrying"
            sleep 5
          done
          echo "production did not return 200 after restart"
          exit 1
